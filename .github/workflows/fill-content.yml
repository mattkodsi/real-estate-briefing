# Content heartbeat: a real headless browser (Playwright) fills any story still
# missing article text, every 30 minutes on GitHub's runners. This is the
# backbone content-filler — it runs with unrestricted egress (unlike the cloud
# routine's sandbox) and executes JavaScript (so Cloudflare challenges pass).
# Idempotent: runs where nothing is missing exit in seconds without a browser.
name: Fill article content

on:
  schedule:
    # every 30 min, 6:00 AM – 9:30 PM ET (EDT = UTC-4) — spans all briefing windows
    - cron: "*/30 10-23 * * *"
    - cron: "*/30 0-1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to fill (YYYY-MM-DD, default: today ET)"
        required: false

concurrency:
  group: fill-content
  cancel-in-progress: false

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-fill-browser
        id: browser

      - name: Fill missing content
        env:
          FILL_PYTHON: ${{ steps.browser.outputs.python-path }}
          FILL_DATE: ${{ inputs.date }}
          AUDIT_PIPELINE_SECRET: ${{ secrets.AUDIT_PIPELINE_SECRET }}
        run: |
          if [ -n "$FILL_DATE" ]; then
            "$FILL_PYTHON" scripts/fill_browser.py "$FILL_DATE"
          else
            "$FILL_PYTHON" scripts/fill_browser.py
          fi

      - name: Record failed worker when setup or execution fails
        if: failure()
        env:
          FILL_PYTHON: ${{ steps.browser.outputs.python-path }}
          FILL_DATE: ${{ inputs.date }}
        run: |
          # The heartbeat client uses only the standard library. If setup itself
          # failed, the runner's system interpreter can still report the outage.
          "${FILL_PYTHON:-/usr/bin/python3}" - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts")
          import fill_content
          fill_content.record_heartbeat(os.environ.get("FILL_DATE") or fill_content._today(), 0, 1, "github-actions", state="failed")
          PY
